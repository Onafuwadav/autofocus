[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autofocus"
version = "1.0.0"
description = "Focus metric comparison and hill-climbing autofocus for phonon microscopy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
hardware = ["pyserial>=3.5"]

[project.scripts]
autofocus = "autofocus.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
